# Однокомандный демо-стенд:  docker compose up  →  http://localhost:8090
# Заполняет БД показательными данными (seed_demo.py) и запускает сервис.
# Для прода: убрать команду seed, подставить свой config.json и STATUS_ADMIN_TOKEN.
services:
  statuspage:
    build: .
    ports:
      - "8090:8090"
    environment:
      STATUS_ADMIN_TOKEN: demo123
      STATUS_CONFIG_FILE: /app/config.demo.json
      STATUS_DATABASE_URL: sqlite:////data/statuspage.db
      STATUS_PUBLIC_BASE_URL: http://localhost:8090
    volumes:
      - statuspage-data:/data
    command: sh -c "python seed_demo.py && uvicorn app.main:app --host 0.0.0.0 --port 8090"
    restart: unless-stopped

volumes:
  statuspage-data:
